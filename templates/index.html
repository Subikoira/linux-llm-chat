<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viikko 5 – LLM-chat (CI/CD)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<!-- data-base = alipolku (esim. /viikko5), jota app.js käyttää API-kutsuissa -->
<body data-base="{{ request.script_root }}">
  <aside>
    <div>
      <h1>Ville's Linux Server</h1>
      <p class="sub">Welcome to my Website!</p>
      <div role="tablist" aria-label="Viikot">
        <a role="tab" href="/" aria-selected="false">Week 1</a>
        <a role="tab" href="/viikko2/" aria-selected="false">Week 2</a>
        <a role="tab" href="/viikko3/" aria-selected="false">Week 3</a>
        <a role="tab" href="http://128.214.254.158/viikko4/" aria-selected="false">Week 4</a>
        <a role="tab" href="{{ request.script_root }}/" aria-selected="true">Week 5</a>
        <a role="tab" href="/viikko6/" aria-selected="false">Week 6</a>
        <a role="tab" href="/viikko7/" aria-selected="false">Week 7</a>
      </div>
    </div>
    <div class="served"><i></i>served by nginx</div>
  </aside>

  <main class="chat">
    <header class="chat__header">
      <div>
        <h1>LLM-chat</h1>
        <p class="chat__meta">Malli: <code>{{ model }}</code> · Nginx → Gunicorn/Flask → Ollama · MariaDB · <a href="{{ url_for('static', filename='dokumentaatio.html') }}">Dokumentaatio</a></p>
      </div>
      <button type="button" id="new-chat" class="btn btn--ghost">Uusi keskustelu</button>
    </header>

    <section id="messages" class="chat__messages" aria-live="polite">
      <p class="chat__empty" id="empty-hint">Kirjoita viesti alle aloittaaksesi keskustelun.</p>
    </section>

    <form id="chat-form" class="chat__form" autocomplete="off">
      <textarea id="message" name="message" rows="2" maxlength="2000"
                placeholder="Kirjoita viesti… (Enter lähettää, Shift+Enter rivinvaihto)" required></textarea>
      <button type="submit" id="send" class="btn">Lähetä</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
